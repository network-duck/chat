<!DOCTYPE html>
<html>
    <head>
        <title>Chat</title>
    </head>
    <body>
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <input type="text" name="message" required>
            <button type="submit">Send</button>
        </form>
    </body>
</html>
